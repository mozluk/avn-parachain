name: CI PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches:
      - main

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  set-up-job:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out PR head (untrusted)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      # pull_request_target runs this workflow from the base branch but checks out
      # attacker-controlled PR code. The .github/ci-scripts below must always be the
      # trusted base version: a malicious PR could otherwise replace them with code
      # that executes with the repository GITHUB_TOKEN (arbitrary code execution).
      - name: Restore trusted CI scripts from the base ref
        run: |
          git fetch "https://github.com/${{ github.event.repository.full_name }}" +"${{ github.event.pull_request.base.sha }}"
          git checkout "${{ github.event.pull_request.base.sha }}" -- .github/ci-scripts

      - name: Install cargo-edit
        uses: baptiste0928/cargo-install@c7dafcfd8a0035d58dfc65d0fbaf71a9ac347715 # v2
        with:
          crate: cargo-edit
          version: '0.13.6'
      - name: Verify PR type
        env:
          description: ${{ github.event.pull_request.body }}
        run: |
          ./.github/ci-scripts/verify_pr_type.sh "$description" "${{ github.event_name }}"

      - name: skip testing
        id: skip_tests
        run: |
          git checkout "${{ github.event.pull_request.head.sha }}"
          commit_message=$(git log -1 --pretty=format:"%s")
          git checkout "${{ github.event.pull_request.base.sha }}"

          SKIP_TESTS=$([[ "$commit_message" == *"tag:skip_testing"* ]] && echo true || echo false)
          echo "SKIP_TESTS=$SKIP_TESTS" >> "$GITHUB_ENV"
          echo "SKIP_TESTS=$SKIP_TESTS" >> "$GITHUB_OUTPUT"

      - name: Get latest repo tag
        if: env.RELEASE == 'true' && env.SKIP_TESTS != 'true'
        id: latest_repo_tag
        uses: WyriHaximus/github-action-get-previous-tag@27c04b107bd8de27966ed909e0992078a9121de8 # v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get next repo tag
        if: env.RELEASE == 'true' && env.SKIP_TESTS != 'true'
        id: new_repo_tag
        uses: WyriHaximus/github-action-next-semvers@1b773ddb3831644dabc80ef5e791ebd4925f7651 # v1
        with:
          version: ${{ steps.latest_repo_tag.outputs.tag }}

      - name: update Versions
        if: env.RELEASE == 'true' && env.SKIP_TESTS != 'true'
        env:
          REGEX_PACKAGE_VERSION: '\(^s*\)\(version\s*=\s*\)\("\([0-9]\+\.\?\)\{3\}"\)'
          REGEX_SPEC_VERSION: '\(^[[:space:]]*\)\(spec_version:\s*\)\([0-9]\+\)'
          REGEX_IMPL_VERSION: '\(^[[:space:]]*\)\(impl_version:\s*\)\([0-9]\+\)'
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          ./.github/ci-scripts/update_versions.sh \
            ${{ steps.new_repo_tag.outputs.major }} \
            ${{ steps.new_repo_tag.outputs.minor }} \
            ${{ steps.new_repo_tag.outputs.patch }} \
            "${{ github.event_name }}"
    outputs:
      SKIP_TESTS: ${{ steps.skip_tests.outputs.SKIP_TESTS }}

  check-code:
    needs: [set-up-job]
    if: |
      ( !github.event.pull_request.draft ) &&
      ( needs.set-up-job.outputs.SKIP_TESTS != 'true' )
    uses: ./.github/workflows/cargo-check.yml
    with:
      fetch-depth: 0
      ref: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}

  test-code:
    needs: [set-up-job]
    if: |
      ( !github.event.pull_request.draft ) &&
      ( needs.set-up-job.outputs.SKIP_TESTS != 'true' )
    uses: ./.github/workflows/cargo-test.yml
    with:
      fetch-depth: 0
      ref: ${{ github.event.pull_request.head.ref }}
      repository: ${{ github.event.pull_request.head.repo.full_name }}