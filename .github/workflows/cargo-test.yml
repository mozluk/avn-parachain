name: Cargo Test

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        description: 'Machine type where the workflow will be run'
        default: gh-ubuntu-2404-x64
      fetch-depth:
        required: false
        type: number
        default: 1
      ref:
        required: false
        type: string
        default: ''
      repository:
        required: false
        type: string
        default: ''

jobs:
  ci:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 90
    
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          profile: minimal
          toolchain: nightly-2023-05-22
          components: rustfmt, clippy
          override: true
          default: true

      - name: Restore cargo cache - common
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ inputs.runs_on }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Linting check
        run: cargo fmt --all --check

  test:
    name: Test Code
    runs-on: ${{ inputs.runs_on }}    
    needs: ci
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          profile: minimal
          toolchain: 1.88.0
          components: rustfmt, clippy
          target: wasm32v1-none
          override: true
          default: true


      - name: Restore cargo cache - common
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ inputs.runs_on }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo cache - test
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            target/
          key: ${{ inputs.runs_on }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}      

      - name: Test Code
        run: cargo test -- --skip test_genesis_config_builds

  runtime-benchmarks:
    name: Runtime Benchmarks
    runs-on: ${{ inputs.runs_on }}    
    needs: ci
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          profile: minimal
          toolchain: 1.88.0
          components: rustfmt, clippy
          target: wasm32v1-none
          override: true
          default: true


      - name: Restore cargo cache - common
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ inputs.runs_on }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo cache - runtime benchmarks
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            target/
          key: ${{ inputs.runs_on }}-runtime-benchmarks-${{ hashFiles('**/Cargo.lock') }}      

      - name: Runtime Benchmarks
        run: cargo test --features runtime-benchmarks -- benchmarks
